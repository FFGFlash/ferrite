[package]
name = "flareite-extension-install"
description = "Installing extensions from GitHub releases: finding releases and catalogs, downloading and checking packages, and installing, updating, and removing extensions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flareite-extension-host = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# Running the client from an async runtime, as the app does. The version
# Tauri already uses.
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
# Writing packages.
zip = { workspace = true }

[lints]
workspace = true
