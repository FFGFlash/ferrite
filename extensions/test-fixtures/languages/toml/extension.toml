# A copy of the languages of the official ferrite.toml extension, for the
# editor's tests, which need real grammars. Not kept in step with it.
id = "test.toml"
name = "TOML"
version = "0.1.0"
description = "TOML highlighting."
author = "Ferrite"
api_version = "1"

[engines]
ferrite = ">=0.1.0"

[[languages]]
id = "toml"
name = "TOML"
file_extensions = ["toml"]
file_names = ["Cargo.lock"]
grammar = "grammars/tree-sitter-toml.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
line_comment = "#"
