# A copy of the languages of the official flareite.python extension, for the
# editor's tests, which need real grammars. Not kept in step with it.
id = "test.python"
name = "Python"
version = "0.1.0"
description = "Python highlighting, and Pyright for diagnostics, hover, definitions, and completion."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

[permissions]
language_servers = true

[[languages]]
id = "python"
name = "Python"
file_extensions = ["py", "pyi"]
grammar = "grammars/tree-sitter-python.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
line_comment = "#"

# `npm install -g pyright`
[[language_servers]]
name = "pyright"
command = "pyright-langserver"
args = ["--stdio"]
languages = ["python"]
root_markers = ["pyproject.toml", "setup.py", "pyrightconfig.json"]
