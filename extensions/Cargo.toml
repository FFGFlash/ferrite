# The example extensions and the test fixtures build to WebAssembly in their
# own workspace, separate from the editor (see `.cargo/config.toml` for the
# target). The official `flareite.*` extensions have repositories of their own.
[workspace]
resolver = "3"
members = ["tidy", "todos", "test-fixtures/misbehaving", "test-fixtures/pages", "test-fixtures/programs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
flareite-extension-api = { path = "../crates/flareite-extension-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
