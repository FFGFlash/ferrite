# Midnight: a deep blue dark theme. Keys are Flareite's color tokens; any
# token left out keeps the dark theme's color.
[colors]
accent = "#7aa2f7"
focus-ring = "#7aa2f7"
border = "#1f2335"
text = "#c0caf5"
text-muted = "#737aa2"
link = "#7dcfff"
workbench-background = "#16161e"
activitybar-background = "#13131a"
activitybar-foreground = "#565f89"
activitybar-active-foreground = "#c0caf5"
sidebar-background = "#16161e"
tabs-background = "#13131a"
tab-active-background = "#1a1b26"
tab-active-foreground = "#c0caf5"
editor-background = "#1a1b26"
editor-foreground = "#c0caf5"
editor-line-number = "#3b4261"
editor-line-number-active = "#a9b1d6"
editor-selection = "#33467c80"
widget-background = "#1f2335"
widget-border = "#292e42"
input-background = "#16161e"
input-border = "#292e42"
notification-background = "#1f2335"
notification-border = "#292e42"
button-background = "#3d59a1"
button-hover-background = "#4a6ab8"
statusbar-background = "#3d59a1"
syntax-comment = "#565f89"
syntax-keyword = "#bb9af7"
syntax-string = "#9ece6a"
syntax-number = "#ff9e64"
syntax-constant = "#ff9e64"
syntax-function = "#7aa2f7"
syntax-type = "#2ac3de"
syntax-macro = "#7dcfff"
syntax-variable = "#c0caf5"
syntax-property = "#73daca"
syntax-operator = "#89ddff"
syntax-punctuation = "#a9b1d6"
syntax-attribute = "#e0af68"
syntax-tag = "#f7768e"
syntax-escape = "#e0af68"
syntax-label = "#bb9af7"
syntax-module = "#e0af68"
