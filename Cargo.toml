[workspace]
resolver = "3"
members = ["benches", "crates/*", "src-tauri"]
# Extensions build for wasm32 in their own workspace.
exclude = ["extensions"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ferrite-core = { path = "crates/ferrite-core" }
ferrite-extension-host = { path = "crates/ferrite-extension-host" }
ferrite-lsp = { path = "crates/ferrite-lsp" }
ferrite-process = { path = "crates/ferrite-process" }
ferrite-syntax = { path = "crates/ferrite-syntax" }
ferrite-tasks = { path = "crates/ferrite-tasks" }
ferrite-terminal = { path = "crates/ferrite-terminal" }
ferrite-text = { path = "crates/ferrite-text" }
ferrite-workspace = { path = "crates/ferrite-workspace" }

base64 = "0.23.1"
# Guesses the encoding of text files that aren't UTF-8, for encoding_rs.
chardetng = "1.0.0"
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
  "html_reports",
  "plotters",
] }
encoding_rs = "0.8.42"
# Webview page tokens. The version the tree already has.
getrandom = "0.4.3"
globset = "0.4.20"
lsp-types = "0.97.0"
ignore = "0.4.33"
memory-stats = "1.2.0"
notify-debouncer-mini = "0.7.0"
open = "5.4.5"
nucleo-matcher = "0.3.1"
portable-pty = "0.9.0"
regex-automata = "0.4.18"
regex-cursor = "0.1.5"
regex-syntax = "0.8.11"
semver = "1.0.28"
toml = "1.1.8"
toml_edit = "0.25.17"
# Only LF, CR and CRLF break lines (matching LSP), not Unicode line separators.
rustix = { version = "1.1.5", features = ["process"] }
ropey = { version = "1.6.1", default-features = false, features = [
  "cr_lines",
  "simd",
] }
streaming-iterator = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
# The same version as the Markdown extension's, whose renderer the
# extension host compiles in for READMEs.
pulldown-cmark = { version = "0.13", default-features = false }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
tracing = "0.1.44"
# `wasm` loads grammars that extensions contribute as WebAssembly. It runs
# them on the wasmtime below, so the two versions must match.
tree-sitter = { version = "0.27.1", features = ["wasm"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-segmentation = "1.13.3"
# Only what extensions need: compiling and running components. No WASI,
# GC, threads, or async. Pinned to the major version tree-sitter's `wasm`
# feature uses (see above), so there is one wasmtime; 48.0.8 has the same
# security fixes as 50.0.1.
wasmtime = { version = "48.0.8", default-features = false, features = [
  "anyhow",
  "component-model",
  "cranelift",
  "parallel-compilation",
  "runtime",
  "std",
] }
wat = "1.262.0"
# Job objects without unsafe code, so stopping a language server stops
# everything it started.
win32job = "2.0.3"
# The version Tauri already uses.
windows-version = "0.1.7"
wit-component = { version = "0.262.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
