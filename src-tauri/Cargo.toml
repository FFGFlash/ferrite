[package]
name = "ferrite-app"
description = "Ferrite desktop application: lifecycle, dependency wiring, and the Tauri command boundary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "ferrite"

[[bin]]
name = "ferrite"
path = "src/main.rs"

[lib]
name = "ferrite_app"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
ferrite-core = { workspace = true }
ferrite-tasks = { workspace = true }
ferrite-text = { workspace = true }
ferrite-workspace = { workspace = true }
memory-stats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }


[lints]
workspace = true
